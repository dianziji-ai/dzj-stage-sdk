# 发版：推到 main 后——
#   · 有没消化的 .changeset/*.md → 开（或更新）一个「发版」PR，版本号和 CHANGELOG 都在里面算好；
#   · 合并了那个 PR（changeset 都消化完）→ 跑完整检查后发布到 npm，打 git tag、建 GitHub Release。
# npm 认证走「可信发布」（OIDC，npm 网站上给每个包登记本仓库的这个工作流）：仓库里不存任何 npm 令牌。
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write       # 推版本提交、打 tag、建 Release
  pull-requests: write  # 开「发版」PR
  id-token: write       # npm 可信发布（OIDC）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 发版
          commit-message: 发版
