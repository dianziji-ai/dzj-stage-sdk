# 每个 PR / 每次推 main：类型检查 + 编译 + 全部测试（带覆盖率门槛）。先编译：包之间的测试从 dist 互相引用。不过就不许合并。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
